<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Médiathèque OWL 2 & SHACL{% endblock %}</title>
    <!-- Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0f9ff',
                            500: '#0284c7',
                            600: '#0369a1',
                            700: '#075985',
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans">
    <!-- Barre de navigation -->
    <header class="bg-slate-900 border-b border-slate-800 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex justify-between h-16 items-center">
            <div class="flex items-center space-x-3">
                <span class="text-2xl">📚</span>
                <div>
                    <a href="/" class="text-lg font-bold tracking-tight text-white hover:text-sky-400">Médiathèque Sémantique</a>
                    <span class="text-xs text-sky-400 block font-mono">PostgreSQL + SHACL Fullstack</span>
                </div>
            </div>
            <nav class="flex space-x-1 sm:space-x-3 text-sm font-medium">
                <a href="/" class="px-3 py-2 rounded-md hover:bg-slate-800 hover:text-white transition">Tableau de bord</a>
                <a href="/livres" class="px-3 py-2 rounded-md hover:bg-slate-800 hover:text-white transition">Livres</a>
                <a href="/abonnes" class="px-3 py-2 rounded-md hover:bg-slate-800 hover:text-white transition">Abonnés</a>
                <a href="/emprunts" class="px-3 py-2 rounded-md hover:bg-slate-800 hover:text-white transition">Emprunts</a>
                <a href="/inference" class="px-3 py-2 rounded-md bg-amber-500/10 text-amber-400 border border-amber-500/30 hover:bg-amber-500/20 transition flex items-center gap-1.5 font-semibold">
                    ⚡ Inférence SHACL-AF
                </a>
                <a href="/rdf-export" class="px-3 py-2 rounded-md hover:bg-slate-800 hover:text-white transition text-slate-400">Graphe RDF</a>
            </nav>
        </div>
    </header>

    <!-- Contenu principal -->
    <main class="flex-1 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full">
        {% block content %}{% endblock %}
    </main>

    <!-- Pied de page -->
    <footer class="bg-slate-900/60 border-t border-slate-800 py-4 text-center text-xs text-slate-500">
        POC Médiathèque — Architecture hybride relationnelle PostgreSQL + Validation & Inférence W3C SHACL
    </footer>
</body>
</html>
